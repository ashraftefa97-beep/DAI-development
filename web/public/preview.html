<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>معاينة تصميم ضي</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#0d1020;color:#f7eaf1;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow:hidden}
    .shell{position:fixed;inset:0;display:grid;grid-template-rows:54px 1fr;background:#0d1020}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;padding-top:env(safe-area-inset-top);border-bottom:1px solid rgba(255,255,255,.08);background:rgba(13,16,32,.96);backdrop-filter:blur(16px)}
    header strong{font-size:13px}
    header span{font-size:10px;color:#9ea1b5}
    button{border:1px solid rgba(247,183,211,.22);background:rgba(247,183,211,.08);color:#f9d8e7;border-radius:10px;padding:8px 11px;font-weight:800}
    .stage{position:relative;min-height:0;background:#fff}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .state{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#0d1020;color:#c7c5d0;z-index:2}
    .state[hidden]{display:none}
    .state b{display:block;color:#f7eaf1;margin-bottom:7px}
    @media(max-width:640px){.shell{grid-template-rows:50px 1fr}header{padding-inline:10px}header span{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><strong>معاينة ضي</strong><span>تشغيل التصميم من DAI Code Studio</span></div>
      <button id="close" type="button">إغلاق</button>
    </header>
    <section class="stage">
      <div class="state" id="state"><div><b>جاري تجهيز المعاينة…</b><span>لحظة واحدة</span></div></div>
      <iframe id="preview" title="معاينة الموقع" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
    </section>
  </main>
  <script>
    (function(){
      var state=document.getElementById('state');
      var frame=document.getElementById('preview');
      document.getElementById('close').addEventListener('click',function(){
        window.close();
        if(!window.closed)history.back();
      });

      var token=new URLSearchParams(location.search).get('token')||'';
      if(!/^[a-f0-9]{64}$/i.test(token)){
        try{token=localStorage.getItem('dai-last-preview-token')||'';}catch(e){}
      }
      if(!/^[a-f0-9]{64}$/i.test(token)){
        state.innerHTML='<div><b>المعاينة غير جاهزة</b><span>ارجع لضي واضغط «فتح الموقع» مرة تانية.</span></div>';
        return;
      }

      if(!new URLSearchParams(location.search).get('token')){
        try{
          var recovered=new URL(location.href);
          recovered.searchParams.set('token',token);
          history.replaceState(null,'',recovered.href);
        }catch(e){}
      }

      var endpoint='https://buenonmbyudjhpedmoqk.supabase.co/functions/v1/code-preview?token='+encodeURIComponent(token);

      frame.addEventListener('load',function(){
        state.hidden=true;
      });

      fetch(endpoint,{cache:'no-store'})
        .then(function(response){
          if(!response.ok)throw new Error('PREVIEW_HTTP_'+response.status);
          return response.text();
        })
        .then(function(html){
          if(!html||html.length<80)throw new Error('PREVIEW_EMPTY');
          frame.srcdoc=html;
        })
        .catch(function(error){
          console.error('DAI preview render failed',error);
          state.innerHTML='<div><b>حصل خطأ في عرض التصميم</b><span>ارجع لضي واضغط «فتح الموقع» مرة تانية.</span></div>';
        });

      setTimeout(function(){
        if(!state.hidden)state.innerHTML='<div><b>جاري تجهيز التصميم…</b><span>ضي بتجهز المعاينة الكاملة.</span></div>';
      },3500);
    })();
  </script>
</body>
</html>

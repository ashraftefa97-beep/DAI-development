<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAI Watch Lite — Redmi Watch 3 Active</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08070e;color:#f8eaf2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{text-align:center;padding:22px}.watch{width:240px;height:280px;border-radius:34px;background:#090711;box-shadow:0 24px 80px #000,0 0 45px rgba(197,133,221,.18),inset 0 0 0 2px #2b2233;position:relative;overflow:hidden}.time{position:absolute;top:14px;left:0;right:0;font-weight:800;font-size:43px;letter-spacing:1px;z-index:4}.face{position:absolute;inset:0}.eye{position:absolute;top:135px;width:21px;height:27px;background:#fff6fb;border-radius:50%;box-shadow:0 0 10px rgba(255,224,240,.25);transition:.3s}.eye.l{left:80px}.eye.r{right:80px}.mouth{position:absolute;left:108px;top:177px;width:24px;height:8px;border-bottom:3px solid #f7aece;border-radius:50%;transition:.22s}.halo{position:absolute;width:160px;height:160px;border-radius:50%;left:40px;top:84px;background:radial-gradient(circle,rgba(183,153,239,.15),transparent 68%);animation:breath 3s ease-in-out infinite}.limb{position:absolute;height:8px;width:74px;background:linear-gradient(90deg,transparent,#d88abd,#f7aece);border-radius:999px;filter:drop-shadow(0 0 7px rgba(247,174,206,.38));transform-origin:right center;top:190px}.limb.l{left:8px;transform:rotate(-10deg);animation:left 4s ease-in-out infinite}.limb.r{right:8px;transform-origin:left center;transform:rotate(10deg) scaleX(-1);animation:right 4s ease-in-out infinite}.state{position:absolute;bottom:19px;left:0;right:0;font-size:11px;color:#aa99b9;letter-spacing:1.4px}.brand{position:absolute;bottom:16px;left:13px;font-size:12px;font-weight:800;color:#f7aece}.battery{position:absolute;bottom:18px;right:12px;font-size:11px;color:#cdbed8}@keyframes breath{50%{transform:scale(1.05);opacity:.82}}@keyframes left{50%{transform:rotate(-25deg) translateY(-13px)}}@keyframes right{50%{transform:rotate(23deg) scaleX(-1) translateY(-11px)}}.note{max-width:440px;margin:18px auto 0;color:#aa9caf;font-size:13px;line-height:1.7}
</style>
</head>
<body><div class="wrap"><div class="watch"><div class="halo"></div><div class="time" id="time">20:26</div><div class="face"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span><span class="limb l"></span><span class="limb r"></span></div><div class="brand">DAI</div><div class="state" id="state">IDLE</div><div class="battery">85%</div></div><div class="note">معاينة DAI Watch Lite بدقة 240×280 لساعتك Redmi Watch 3 Active. نسخة الساعة الفعلية تستخدم 60 فريم مرتبطة بالثواني للحركة منخفضة الطاقة.</div></div><script>
const states=['IDLE','LISTEN','THINK','TALK'];function tick(){const d=new Date(),s=d.getSeconds();document.getElementById('time').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const st=states[Math.floor(s/15)];document.getElementById('state').textContent=st;const mouth=document.querySelector('.mouth');mouth.style.height=st==='TALK'?(6+Math.abs(Math.sin(s))*12)+'px':'8px';mouth.style.border=st==='TALK'?'2px solid #f7aece':'0';mouth.style.borderBottom='3px solid #f7aece';}tick();setInterval(tick,500);
</script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101321" />
  <title>DAI AI — ضي</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#101321;overflow:hidden}
    body{font-family:"Segoe UI",Tahoma,Arial,sans-serif}
    .shell{position:fixed;inset:0;background:#101321}
    iframe{display:block;width:100%;height:100%;border:0;background:#101321;position:relative;z-index:1}
    .fallback{
      position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;color:#f7eff5;
      background:radial-gradient(circle at 50% 36%,rgba(185,154,222,.13),transparent 30%),
      radial-gradient(circle at 50% 72%,rgba(246,169,193,.09),transparent 36%),#101321;
      z-index:0
    }
    .card{max-width:520px}
    .logo{width:132px;height:132px;object-fit:contain}
    h1{margin:16px 0 8px;color:#ffd4e1}
    p{color:#bcb1c4;line-height:1.8}
    a{display:inline-block;margin-top:12px;padding:12px 20px;border-radius:14px;text-decoration:none;font-weight:800;color:#271a2b;background:linear-gradient(135deg,#f6a9c1,#b99ade)}
  </style>
</head>
<body>
  <div class="shell">
    <div class="fallback">
      <div class="card">
        <img class="logo" src="./dai-logo.svg" alt="DAI AI" />
        <h1>DAI AI</h1>
        <p>لو النسخة المدمجة ما ظهرتش، افتح DAI من الزر ده.</p>
        <a href="https://dai-ai-y3325n.v2.appdeploy.ai/" target="_blank" rel="noopener">فتح DAI AI</a>
      </div>
    </div>
    <iframe
      src="https://dai-ai-y3325n.v2.appdeploy.ai/"
      title="DAI AI"
      allow="microphone; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>
</body>
</html>

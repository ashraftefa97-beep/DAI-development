name: Web Research Probe

on:
  push:
    paths:
      - '.github/workflows/web-research-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Find working grounded-search model
        shell: bash
        run: |
          set -euo pipefail
          URL="https://buenonmbyudjhpedmoqk.supabase.co/functions/v1/web-research-probe"
          BODY="$(curl -fsS --retry 2 --retry-delay 2 "$URL")"
          echo "$BODY"
          echo "$BODY" | jq -e '
            .ok == true and
            (.winner | length) > 0 and
            ([.results[] | select(.status == 200 and .answer == true and (.sources | tonumber) > 0)] | length) > 0
          '

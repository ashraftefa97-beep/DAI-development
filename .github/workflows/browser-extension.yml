name: Build DAI Browser Extension

on:
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - '.github/workflows/browser-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        run: python -m json.tool browser-extension/manifest.json > /dev/null

      - name: Package extension
        run: |
          cd browser-extension
          zip -r ../DAI-Side-Browser-Extension.zip manifest.json content.js background.js

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: DAI-Side-Browser-Extension
          path: DAI-Side-Browser-Extension.zip
          retention-days: 90

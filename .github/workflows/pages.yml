name: Deploy DAI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package.json

      - name: Prepare CC0 DAI sound library
        working-directory: web
        run: |
          set -euo pipefail
          mkdir -p public/sfx/kenney/interface public/sfx/kenney/impact public/sfx/kenney/rpg public/sfx/kenney/scifi

          curl -fsSL "https://kenney.nl/media/pages/assets/interface-sounds/fa43c1dd4d-1677589452/kenney_interface-sounds.zip" -o /tmp/dai-interface.zip
          curl -fsSL "https://kenney.nl/media/pages/assets/impact-sounds/87b4ddecda-1677589768/kenney_impact-sounds.zip" -o /tmp/dai-impact.zip
          curl -fsSL "https://kenney.nl/media/pages/assets/rpg-audio/8e99002d76-1677590336/kenney_rpg-audio.zip" -o /tmp/dai-rpg.zip
          curl -fsSL "https://kenney.nl/media/pages/assets/sci-fi-sounds/6b296f9ecf-1677589334/kenney_sci-fi-sounds.zip" -o /tmp/dai-scifi.zip

          unzip -q /tmp/dai-interface.zip -d public/sfx/kenney/interface
          unzip -q /tmp/dai-impact.zip -d public/sfx/kenney/impact
          unzip -q /tmp/dai-rpg.zip -d public/sfx/kenney/rpg
          unzip -q /tmp/dai-scifi.zip -d public/sfx/kenney/scifi

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("public/sfx/kenney")
          files=[]
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.suffix.lower() in {".wav",".ogg",".mp3"}:
                  files.append("./"+p.as_posix().replace("public/",""))
          (root/"manifest.json").write_text(json.dumps({"files":files},ensure_ascii=False,indent=2),encoding="utf-8")
          (root/"LICENSE.txt").write_text(
              "Kenney audio packs used by DAI are licensed Creative Commons CC0.\n"
              "Source: https://kenney.nl/assets\n",
              encoding="utf-8"
          )
          print("DAI CC0 sound files:", len(files))
          for item in files[:260]:
              print(item)
          PY

      - name: Validate and build standalone GitHub app
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run test
          npm run architecture-check
          cp github.html index.html
          npm run build

          # Explicitly publish watch bridge/static watch assets. Vite normally
          # copies public/, but keeping this explicit makes the watch routes
          # deterministic and lets CI catch a missing iPhone bridge before deploy.
          mkdir -p dist/watch
          cp -R public/watch/. dist/watch/
          test -f dist/watch/iphone-bridge/index.html
          test -f dist/watch/redmi3-active/index.html

          npm run security-check
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: End-to-end deployment smoke
        env:
          DAI_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DAI_SUPABASE_URL: https://buenonmbyudjhpedmoqk.supabase.co
        run: |
          set -euo pipefail

          echo "Checking deployed DAI page: ${DAI_PAGE_URL}"
          curl -fsSL --retry 5 --retry-delay 2 "${DAI_PAGE_URL}" -o /tmp/dai-page.html
          grep -q "DAI AI" /tmp/dai-page.html

          curl -fsSL --retry 5 --retry-delay 2 "${DAI_PAGE_URL%/}/sw.js" -o /tmp/dai-sw.js
          grep -q "networkFirst" /tmp/dai-sw.js

          chat_status="$(curl -sS -o /tmp/chat-unauth.json -w "%{http_code}"             -X POST "${DAI_SUPABASE_URL}/functions/v1/chat-stream"             -H "content-type: application/json"             --data '{"message":"health-check"}')"
          test "${chat_status}" = "401"

          research_status="$(curl -sS -o /tmp/research-unauth.json -w "%{http_code}"             -X POST "${DAI_SUPABASE_URL}/functions/v1/web-research"             -H "content-type: application/json"             --data '{"query":"health-check"}')"
          test "${research_status}" = "401"

          options_status="$(curl -sS -o /tmp/chat-options.txt -w "%{http_code}"             -X OPTIONS "${DAI_SUPABASE_URL}/functions/v1/chat-stream")"
          test "${options_status}" = "200"

          echo "DAI public deployment and edge gateway smoke checks passed."
